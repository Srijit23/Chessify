<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SrijitChess - Play Online</title>
    
    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --board-light: #e2e8f0;
            --board-dark: #475569;
            --highlight-light: #fde047;
            --highlight-dark: #ca8a04;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0b0e;
            color: #f5f5f7;
            user-select: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Titanium Slate Custom Chess Grid (#board) */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            touch-action: none;
            position: relative;
            background-color: var(--board-dark);
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.08s ease;
            touch-action: none;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .square.light.highlighted { background-color: var(--highlight-light) !important; }
        .square.dark.highlighted { background-color: var(--highlight-dark) !important; }

        .square.selected {
            background-color: rgba(255, 255, 51, 0.65) !important;
        }

        .square.in-check {
            background: radial-gradient(circle, rgba(239,68,68,0.9) 0%, rgba(220,38,38,0.6) 60%, transparent 100%) !important;
        }

        /* Legal Move Indicators */
        .legal-dot {
            width: 26%;
            height: 26%;
            border-radius: 9999px;
            background-color: rgba(0, 0, 0, 0.20);
            pointer-events: none;
            z-index: 10;
        }

        .legal-capture-ring {
            position: absolute;
            inset: 6%;
            border: 4.5px solid rgba(0, 0, 0, 0.22);
            border-radius: 9999px;
            pointer-events: none;
            z-index: 10;
        }

        /* Chess Piece Styling */
        .chess-piece {
            width: 85%;
            height: 85%;
            z-index: 15;
            background: transparent !important;
            transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.38));
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .square:hover .chess-piece {
            transform: scale(1.035);
        }

        .square.dragging-origin .chess-piece {
            opacity: 0.25 !important;
            transform: scale(0.94) !important;
        }

        .square.drag-target-hover {
            box-shadow: inset 0 0 0 3.5px rgba(255, 255, 255, 0.9) !important;
        }

        /* Floating Transparent Dragged Piece Layer */
        #drag-ghost-piece {
            position: fixed;
            top: 0;
            left: 0;
            width: 74px;
            height: 74px;
            pointer-events: none;
            z-index: 9999;
            background: transparent !important;
            opacity: 0.94;
            filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.55));
            will-change: transform;
            display: none;
        }

        #drag-ghost-piece svg {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }

        .board-container {
            max-width: 480px;
            margin: auto;
            padding: 1.5rem;
            background: #181a23;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Basic chat styling */
        .chat-box {
            height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #12141a;
            display: flex;
            flex-direction: column;
        }
        .chat-message {
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #cbd5e1;
        }
        .chat-message strong {
            color: #38bdf8;
        }

        .move-history {
            max-height: 160px;
            overflow-y: auto;
            background: #12141a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.85rem;
        }

        /* Navbar styling */
        .navbar {
            background: #12141a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.2);
            padding: 6px 10px;
            border-radius: 4px;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3cpath stroke='white' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
        .navbar-nav {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            align-items: center;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .navbar-nav .nav-item {
            display: inline-block;
        }
        .navbar-nav .nav-link {
            font-size: 1rem;
            font-weight: 600;
            color: #e2e8f0 !important;
            padding: 10px 0;
            transition: all 0.3s ease-in-out;
        }
        .navbar-nav .nav-link:hover {
            color: #38bdf8 !important;
            transform: translateY(-1px);
        }
        .brand-logo {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }
        .airsland-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
    </style>
</head>
<body>
   <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="images/logo.png" alt="Chess Piece" class="brand-logo">
        <span class="airsland-name">Airsland</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html/#practice">Practice</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
        </ul>
      </div>
    </div>
  </nav>

    <!-- Game Section -->
    <section class="game-section py-5">
        <div class="container">
            <div class="row justify-content-center mb-4">
                <div class="col-md-6 text-center">
                    <div id="roomControls">
                        <h2 class="mb-4 text-white">Play Online Chess</h2>
                        <div class="card bg-dark text-white border-secondary">
                            <div class="card-body">
                                <div class="mb-3 text-start">
                                    <label for="roomId" class="form-label">Room ID</label>
                                    <input type="text" class="form-control bg-secondary text-white border-0" id="roomId" placeholder="Enter room ID">
                                </div>
                                <div class="d-grid gap-2">
                                    <button id="createRoom" class="btn btn-primary">Create Room</button>
                                    <button id="joinRoom" class="btn btn-secondary">Join Room</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="gameArea" class="row" style="display: none;">
                <div class="col-md-8 mb-4">
                    <div class="board-container">
                        <!-- ID 'board' preserved for multiplayer.js compatibility -->
                        <div id="board"></div>
                        <div id="gameStatus" class="alert alert-dark mt-3 mb-0 text-white border-secondary" role="alert">
                            Waiting for opponent...
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-dark text-white border-secondary">
                        <div class="card-body">
                            <h5 class="card-title text-info mb-3">Game Info</h5>
                            <div class="game-info mb-4">
                                <p class="mb-2"><strong>Room ID:</strong> <span id="currentRoom"></span></p>
                                <p class="mb-2"><strong>Playing as:</strong> <span id="playerColor"></span></p>
                                <p class="mb-0"><strong>Status:</strong> <span id="gameStatusText">Waiting...</span></p>
                            </div>

                            <div class="game-controls">
                                <div class="d-flex gap-2 mb-3">
                                    <button id="resignBtn" class="btn btn-outline-danger flex-fill" disabled>Resign</button>
                                    <button id="offerDrawBtn" class="btn btn-outline-warning flex-fill" disabled>Offer Draw</button>
                                </div>
                                
                                <div class="mt-3">
                                    <h6 class="text-secondary mb-2">Move History:</h6>
                                    <div id="moveHistory" class="move-history"></div>
                                </div>

                                <div class="mt-3">
                                    <h6 class="text-secondary mb-2">Chat:</h6>
                                    <div id="chatBox" class="chat-box"></div>
                                    <div class="input-group">
                                        <input type="text" id="chatInput" class="form-control bg-secondary text-white border-0" placeholder="Type a message...">
                                        <button id="sendChat" class="btn btn-primary">Send</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Floating Transparent Drag Ghost -->
    <div id="drag-ghost-piece"></div>

        };

        class ChessboardCompat {
            constructor(containerId, config = {}) {
                this.containerId = containerId;
                this.config = config;
                this.orientationVal = config.orientation || 'white';
                this.draggable = config.draggable !== false;
                
                this.game = new Chess();
                if (config.position) {
                    if (config.position === 'start') {
                        this.game.reset();
                    } else {
                        try { this.game.load(config.position); } catch(e) { this.game.reset(); }
                    }
                }

                this.selectedSquare = null;
                this.legalMovesFromSelected = [];
                this.dragState = { active: false, hasMoved: false, fromSquare: null, pieceKey: null, startX: 0, startY: 0, hoveredSquare: null };

                this.initDragEvents();
                this.render();
            }

            position(pos) {
                if (pos === undefined) {
                    return this.game.fen();
                }
                if (pos === 'start') {
                    this.game.reset();
                } else if (typeof pos === 'string') {
                    try { this.game.load(pos); } catch(e) {}
                } else if (typeof pos === 'object') {
                    this.game.clear();
                    for (const [sq, pCode] of Object.entries(pos)) {
                        let color = pCode[0].toLowerCase();
                        let type = pCode[1].toLowerCase();
                        this.game.put({ type, color }, sq);
                    }
                }
                this.render();
            }

            orientation(ori) {
                if (ori === undefined) return this.orientationVal;
                if (ori === 'white' || ori === 'black') {
                    this.orientationVal = ori;
                    this.render();
                }
                return this.orientationVal;
            }

            flip() {
                this.orientationVal = this.orientationVal === 'white' ? 'black' : 'white';
                this.render();
            }

            clear() {
                this.game.clear();
                this.render();
            }

            start() {
                this.game.reset();
                this.render();
            }

            fen() {
                return this.game.fen();
            }

            resize() {
                this.render();
            }

            destroy() {
                const boardEl = document.getElementById(this.containerId);
                if (boardEl) {
                    boardEl.innerHTML = '';
                }
            }

            render() {
                const boardEl = document.getElementById(this.containerId);
                if (!boardEl) return;
                boardEl.innerHTML = '';
                const boardData = this.game.board();
                const turn = this.game.turn();
                const inCheck = this.game.in_check();
                const flipped = this.orientationVal === 'black';

                for (let rIdx = 0; rIdx < 8; rIdx++) {
                    for (let cIdx = 0; cIdx < 8; cIdx++) {
                        const row = flipped ? 7 - rIdx : rIdx;
                        const col = flipped ? 7 - cIdx : cIdx;
                        const fileChar = String.fromCharCode(97 + col);
                        const rankChar = String(8 - row);
                        const sqName = fileChar + rankChar;

                        const isLight = (row + col) % 2 === 0;
                        const sqDiv = document.createElement('div');
                        sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                        sqDiv.dataset.square = sqName;

                        if (this.selectedSquare === sqName) {
                            sqDiv.classList.add('selected');
                        }

                        const piece = boardData[row][col];
                        if (piece && inCheck && piece.type === 'k' && piece.color === turn) {
                            sqDiv.classList.add('in-check');
                        }

                        if (piece) {
                            const key = piece.color + piece.type.toUpperCase();
                            sqDiv.insertAdjacentHTML('beforeend', PIECE_SVGS[key] || '');
                        }

                        const legalTarget = this.legalMovesFromSelected.find(m => m.to === sqName);
                        if (legalTarget) {
                            if (piece || legalTarget.flags.includes('e')) {
                                const ring = document.createElement('div');
                                ring.className = 'legal-capture-ring';
                                sqDiv.appendChild(ring);
                            } else {
                                const dot = document.createElement('div');
                                dot.className = 'legal-dot';
                                sqDiv.appendChild(dot);
                            }
                        }

                        sqDiv.addEventListener('pointerdown', (e) => this.onSquarePointerDown(e, sqName));
                        boardEl.appendChild(sqDiv);
                    }
                }
            }

            onSquarePointerDown(e, sqName) {
                if (!this.draggable || (e.button !== undefined && e.button !== 0)) return;

                const targetMove = this.legalMovesFromSelected.find(m => m.to === sqName);
                if (this.selectedSquare && targetMove) {
                    e.preventDefault();
                    this.handleMove(this.selectedSquare, sqName);
                    return;
                }

                const piece = this.game.get(sqName);
                if (!piece || piece.color !== this.game.turn() || (this.config.onDragStart && this.config.onDragStart(sqName, piece, this.game.fen(), this.orientationVal) === false)) {
                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.render();
                    return;
                }

                e.preventDefault();
                this.selectedSquare = sqName;
                this.legalMovesFromSelected = this.game.moves({ square: sqName, verbose: true });
                this.render();

                const pieceKey = piece.color + piece.type.toUpperCase();
                this.dragState = {
                    active: true,
                    hasMoved: false,
                    fromSquare: sqName,
                    pieceKey,
                    startX: e.clientX,
                    startY: e.clientY,
                    hoveredSquare: sqName
                };

                const boardEl = document.getElementById(this.containerId);
                const ghostEl = document.getElementById('drag-ghost-piece');
                if (boardEl && ghostEl) {
                    const sqSize = boardEl.getBoundingClientRect().width / 8;
                    ghostEl.style.width = `${sqSize * 1.08}px`;
                    ghostEl.style.height = `${sqSize * 1.08}px`;
                    ghostEl.innerHTML = PIECE_SVGS[pieceKey] || '';
                }
            }

            onPointerMove(e) {
                if (!this.dragState.active) return;
                const dx = e.clientX - this.dragState.startX;
                const dy = e.clientY - this.dragState.startY;

                if (!this.dragState.hasMoved && Math.hypot(dx, dy) > 4) {
                    this.dragState.hasMoved = true;
                    document.querySelector(`.square[data-square="${this.dragState.fromSquare}"]`)?.classList.add('dragging-origin');
                    const ghostEl = document.getElementById('drag-ghost-piece');
                    if (ghostEl) ghostEl.style.display = 'block';
                }

                if (this.dragState.hasMoved) {
                    e.preventDefault();
                    const ghostEl = document.getElementById('drag-ghost-piece');
                    if (ghostEl) {
                        ghostEl.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
                    }
                    const targetSq = this.getSquareFromClientXY(e.clientX, e.clientY);
                    if (targetSq !== this.dragState.hoveredSquare) {
                        if (this.dragState.hoveredSquare) {
                            document.querySelector(`.square[data-square="${this.dragState.hoveredSquare}"]`)?.classList.remove('drag-target-hover');
                        }
                        this.dragState.hoveredSquare = targetSq;
                        if (targetSq) {
                            document.querySelector(`.square[data-square="${targetSq}"]`)?.classList.add('drag-target-hover');
                        }
                    }
                }
            }

            onPointerUp(e) {
                if (!this.dragState.active) return;
                const wasDragging = this.dragState.hasMoved;
                const fromSq = this.dragState.fromSquare;
                const dropSq = this.getSquareFromClientXY(e.clientX, e.clientY);

                const ghostEl = document.getElementById('drag-ghost-piece');
                if (ghostEl) {
                    ghostEl.style.display = 'none';
                    ghostEl.innerHTML = '';
                }
                document.querySelectorAll('.square.dragging-origin, .square.drag-target-hover').forEach(el => {
                    el.classList.remove('dragging-origin', 'drag-target-hover');
                });

                this.dragState.active = false;
                this.dragState.hasMoved = false;

                if (wasDragging && dropSq && dropSq !== fromSq) {
                    const legalTarget = this.legalMovesFromSelected.find(m => m.to === dropSq);
                    if (legalTarget) {
                        this.handleMove(fromSq, dropSq);
                    }
                }
            }

            handleMove(from, to) {
                const oldFen = this.game.fen();
                const pieceObj = this.game.get(from);
                
                let promotion = 'q';
                const moveResult = this.game.move({ from, to, promotion });

                if (moveResult) {
                    const newFen = this.game.fen();
                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.render();

                    if (this.config.onDrop) {
                        const dropRes = this.config.onDrop(from, to, pieceObj ? pieceObj.color + pieceObj.type.toUpperCase() : 'wP', newFen, oldFen, this.orientationVal);
                        if (dropRes === 'snapback') {
                            this.game.load(oldFen);
                            this.render();
                            return;
                        }
                    }
                    if (this.config.onSnapEnd) {
                        this.config.onSnapEnd();
                    }
                } else {
                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.render();
                }
            }

            getSquareFromClientXY(clientX, clientY) {
                const boardEl = document.getElementById(this.containerId);
                if (!boardEl) return null;
                const rect = boardEl.getBoundingClientRect();
                if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return null;
                const cIdx = Math.min(7, Math.max(0, Math.floor(((clientX - rect.left) / rect.width) * 8)));
                const rIdx = Math.min(7, Math.max(0, Math.floor(((clientY - rect.top) / rect.height) * 8)));
                const flipped = this.orientationVal === 'black';
                const row = flipped ? 7 - rIdx : rIdx;
                const col = flipped ? 7 - cIdx : cIdx;
                return String.fromCharCode(97 + col) + String(8 - row);
            }

            initDragEvents() {
                window.addEventListener('pointermove', (e) => this.onPointerMove(e), { passive: false });
                window.addEventListener('pointerup', (e) => this.onPointerUp(e));
                window.addEventListener('pointercancel', (e) => this.onPointerUp(e));
            }
        }

        // Global Chessboard factory function expected by multiplayer.js
        window.Chessboard = function(containerId, config) {
            return new ChessboardCompat(containerId, config);
        };
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <!-- Multiplayer backend script -->
    <script src="multiplayer.js"></script>
    
    <script>
        // Initialize WebSocket connection when page loads
        $(document).ready(() => {
            connectToServer();
        });
    </script>
</body>
